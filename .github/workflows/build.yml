name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-java@main
        with: { distribution: zulu, java-version: 17 }
      - uses: android-actions/setup-android@main
      
      - name: Build
        run: |
          # 1. 动态获取系统自带的 SDK 路径
          export SDK_PATH=$ANDROID_HOME
          
          # 2. 骗过 make.sh：它固执地要当前目录的 cmdline-tools，建个快捷方式
          ln -s $SDK_PATH/cmdline-tools ./cmdline-tools
          
          # 3. 强制让两个变量统一，消灭冲突
          export ANDROID_SDK_ROOT=$SDK_PATH
          export ANDROID_HOME=$SDK_PATH
          
          # 4. 生成 local.properties，告诉 Gradle 明确的 SDK 路径
          echo "sdk.dir=$SDK_PATH" > local.properties
          
          cp webapk.conf default.conf
          chmod +x make.sh
          
          echo "正在生成签名证书..."
          ./make.sh keygen
          
          echo "正在初始化并解压源码..."
          ./make.sh build default.conf
          
          echo "开始打包 APK..."
          ./make.sh apk
          
      - uses: actions/upload-artifact@main
        with:
          name: vstuff-apk
          path: '*.apk'
          if-no-files-found: error